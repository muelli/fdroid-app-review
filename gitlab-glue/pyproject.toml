[project]
name = "fdroid-review-gitlab-glue"
version = "0.1.0"
description = "GitLab adapter (mock and real) and comment templates for fdroid-review-session"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "python-gitlab>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitlab_glue"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
