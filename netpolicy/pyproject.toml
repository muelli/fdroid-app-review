[project]
name = "fdroid-review-netpolicy"
version = "0.1.0"
description = "Per-session nftables ruleset generator and passive DNS/SNI logger"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netpolicy"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
