# Runs local-image/avd_fallback.sh --review, unmodified, on a GitHub-hosted runner: boots the
# AOSP x86_64 emulator under nsntrace, runs scripts/quick_review.py against it, adds the network
# evidence, and uploads quick-review output as an artifact. Started with `gh workflow run`
# (ci-spike/gh-review.sh does that, waits and downloads).
#
# No secrets are used. No third-party uploads: none of quick_review's --upload-* or --virustotal
# options are passed. In a public repository the job log and the artifact are world-readable.
name: review
# The tag lets a caller find the run it started (`gh workflow run` does not say which run that is).
run-name: review ${{ inputs.package }} ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: https URL of a public CI-built APK
        required: true
      package:
        description: Android package name (e.g. org.fdroid.fdroid)
        required: true
      mr_iid:
        description: fdroiddata merge request number (optional; writes review_comment.md)
        required: false
        default: ""
      duration:
        description: seconds to record (quick_review clamps to 180)
        required: false
        default: "60"
      tag:
        description: free-form tag shown in the run name, so a caller can find its run
        required: false
        default: ""

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Inputs only ever reach the shell through the environment, never through ${{ }} in a
      # script, so an input cannot inject shell code.
      APK_URL: ${{ inputs.apk_url }}
      PKG: ${{ inputs.package }}
      MR_IID: ${{ inputs.mr_iid }}
      DURATION: ${{ inputs.duration }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the inputs
        run: |
          [[ "$APK_URL" =~ ^https://[A-Za-z0-9._~:/?#@!\$\&\'()*+,\;=%-]+$ ]] || { echo "apk_url must be https"; exit 1; }
          [[ "$PKG" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]] || { echo "bad package"; exit 1; }
          [[ -z "$MR_IID" || "$MR_IID" =~ ^[0-9]{1,7}$ ]] || { echo "bad mr_iid"; exit 1; }
          [[ "$DURATION" =~ ^[0-9]{1,3}$ ]] || { echo "bad duration"; exit 1; }

      - name: Host facts
        run: |
          echo "nproc: $(nproc)"; free -m | head -2; df -h / | tail -1
          ls -l /dev/kvm || echo "NO /dev/kvm"
          echo "ip_forward before: $(cat /proc/sys/net/ipv4/ip_forward)"
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"

      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: nsntrace and IP forwarding
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsntrace
          nsntrace --help 2>&1 | head -3 || true
          sudo sysctl -w net.ipv4.ip_forward=1

      - name: Android command-line tools on PATH
        run: |
          {
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/platform-tools"
            # aapt2, so quick_review reads the permissions from the APK
            ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1
          } >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools > /dev/null
          "$ANDROID_HOME/emulator/emulator" -version | head -1

      - name: Download the APK
        run: |
          mkdir -p work
          curl -fsSL --retry 3 --max-filesize 200000000 -o work/app.apk "$APK_URL"
          sha256sum work/app.apk; ls -l work/app.apk

      - name: Review (local-image/avd_fallback.sh --review, unmodified)
        run: |
          args=(--apk "$PWD/work/app.apk" --review --package "$PKG" --duration "$DURATION"
                --output-dir "$PWD/out/quick-review"
                --review-arg --video-bit-rate --review-arg 4)
          [[ -n "$MR_IID" ]] && args+=(--mr-iid "$MR_IID")
          t0=$(date +%s)
          status=0
          local-image/avd_fallback.sh "${args[@]}" || status=$?
          echo "avd_fallback.sh exit status ${status} after $(( $(date +%s) - t0 )) s"
          echo "## avd_fallback.sh: exit ${status}, $(( $(date +%s) - t0 )) s" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Where did the AVD go (on failure)
        if: failure()
        run: |
          sudo find / -xdev -name 'fdroid-review-*.ini' -not -path '/proc/*' 2>/dev/null || true
          avdmanager list avd 2>&1 | head -20 || true

      - name: Network evidence check
        if: always()
        run: |
          pcap=out/quick-review/network_capture.pcap
          ls -l out/quick-review/ || true
          [[ -f "$pcap" ]] || { echo "no pcap"; exit 0; }
          # DNS questions and TLS SNI, from the pcap itself (independent of quick_review's parser)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q tshark > /dev/null 2>&1 || true
          if command -v tshark > /dev/null; then
            echo "--- DNS queries"; tshark -r "$pcap" -Y 'dns.flags.response==0' -T fields -e dns.qry.name 2>/dev/null | sort | uniq -c | sort -rn | head -40
            echo "--- TLS SNI"; tshark -r "$pcap" -Y 'tls.handshake.extensions_server_name' -T fields -e tls.handshake.extensions_server_name 2>/dev/null | sort | uniq -c | sort -rn | head -40
          fi

      - name: Upload the review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-review
          path: out/quick-review/
          retention-days: 3
          if-no-files-found: warn
